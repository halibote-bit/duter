[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goodluck"
version = "0.1.0"
description = "Cast a spell: a wand appears and fireworks bloom, ending with GOOD LUCK glowing in the sky — one line of magic, zero dependencies, and maybe a little luck."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "halibote" }]
keywords = ["goodluck", "good-luck", "fireworks", "wand", "magic", "toy", "animation", "tkinter"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/halibote-bit/goodluck"

[project.scripts]
goodluck = "goodluck.__main__:main"

[tool.setuptools.packages.find]
include = ["goodluck*"]
